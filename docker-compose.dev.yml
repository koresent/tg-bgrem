services:
  rembg:
    image: danielgatis/rembg:latest
    restart: unless-stopped
    command: ["s", "--host", "0.0.0.0", "--port", "7000"]
    volumes:
      - rembg_models:/root/.u2net
    ports:
      - "7000:7000"

  tg-bgrem-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tg-bgrem-dev
    restart: always
    volumes:
      - .:/app
    env_file:
      - .env
    command: ["python", "main.py"]
    depends_on:
      - rembg

volumes:
  rembg_models:
